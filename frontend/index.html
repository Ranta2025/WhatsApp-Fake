<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/todos.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1015" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="todos" />
    <meta name="description" content="todos — mensajería, llamadas y grupos en tiempo real" />
    <script>
      // Applies the saved theme before first paint (no flash). Keep ids/colors in sync with src/features/theme/themes.ts (tested).
      (function () {
        var m = { dark: "#0a1015", light: "#f3f6f7", rosa: "#fbe9ef", menta: "#e9fbf2", lavanda: "#f1e9fb", durazno: "#fbf1e9", cielo: "#e9f4fb" };
        var t = "dark";
        try {
          var p = localStorage.getItem("whatsapp-fake:theme");
          if (p === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          else if (p && Object.prototype.hasOwnProperty.call(m, p)) t = p;
        } catch (e) {}
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t === "dark" ? "dark" : "light";
        var c = document.querySelector("meta[name=theme-color]");
        if (c) c.setAttribute("content", m[t]);
      })();
    </script>
    <title>todos · Chat en tiempo real</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
