name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Go + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go unit tests
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Docker stack)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack
        run: docker compose up -d --build --wait

      # compose --wait solo mira los healthchecks de los contenedores: esto confirma que la app responde.
      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 --connect-timeout 2 http://localhost:8080/healthz >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy" >&2
          exit 1

      # Solo -tags e2e: los tests -tags integration hacen TRUNCATE de las tablas.
      - name: Go e2e tests
        run: make test-integration

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump docker compose logs
        if: failure() || cancelled()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload docker compose logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
