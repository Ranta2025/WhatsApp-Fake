# Cabeceras de seguridad compartidas. nginx descarta TODOS los add_header
# heredados en cualquier location que declare los suyos, por eso este snippet
# se incluye a nivel server y en cada location con add_header propio.
# Sin HSTS: TLS termina en Cloudflare, no en este nginx.
# CSP conservadora a propósito (sin script/style/connect-src) para no romper
# ZegoCloud, Google Fonts ni media blob/data.
# Sin Permissions-Policy: la app usa cámara/micrófono (llamadas, notas de voz).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
