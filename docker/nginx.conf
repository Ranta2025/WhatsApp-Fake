worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Necesario para WebSocket a través de proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # El backend acepta subidas de hasta 110 MB (video)
        client_max_body_size 110m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API + WebSocket (toda la API vive bajo /api, incluida /api/v1/auth)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /healthz {
            proxy_pass http://backend;
        }

        # Archivos subidos (MinIO): /storage/<bucket>/<objeto>
        location /storage/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-request-id;
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
        }

        # Assets con hash: caché de larga duración
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # El service worker y el HTML siempre frescos
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA: cualquier otra ruta la resuelve React Router
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
